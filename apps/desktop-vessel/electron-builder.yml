appId: com.fleetops.desktop-vessel
productName: FleetOps
copyright: Copyright © 2026 FleetOps

directories:
  output: release

# Distribute compiled main-process files and package metadata.
files:
  - dist/**
  - package.json

# Bundle the api-vessel deploy snapshot (built by scripts/prepare-bundle.mjs)
# and the built React SPA into extraResources so they live at
# process.resourcesPath/<name>/ at runtime.
extraResources:
  - from: 'api-vessel-bundle'
    to: 'api-vessel'
    filter:
      - '**/*'
  - from: '../web-shore/dist'
    to: renderer

# Native binaries (better-sqlite3) must be unpacked from app.asar so they can
# be loaded as .node files at runtime.
asarUnpack:
  - '**/node_modules/better-sqlite3/**'

win:
  target: nsis
  requestedExecutionLevel: asInvoker
  forceCodeSigning: false
  signDlls: false

nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true

linux:
  target: AppImage
  category: Utility

mac:
  target: dmg
  category: public.app-category.utilities
